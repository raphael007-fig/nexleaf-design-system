<svg viewBox="0 0 900 520" width="900" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Nexleaf design workflow</title>
  <desc>Collect to Track to Create to Verify to Deliver, with domain memory feeding Create, a mirror handshake between Figma and prototype, three delivery surfaces, and a correction loop back into the skills.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#005bd3" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="32" y="38" font-size="18" font-weight="700" fill="#1a1a1a">Nexleaf design workflow</text>
  <text x="32" y="58" font-size="12.5" fill="#6b6b6b">One source of truth per layer, deterministic bridges between them, and nothing changes silently.</text>

  <!-- domain memory -->
  <rect x="286" y="84" width="196" height="38" rx="8" fill="#f4f6f8" stroke="#c9ced4" stroke-dasharray="4 3"/>
  <text x="384" y="102" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">ColdTrace domain memory</text>
  <text x="384" y="116" text-anchor="middle" font-size="10.5" fill="#8a8a8a">how the product actually behaves</text>
  <line x1="384" y1="124" x2="384" y2="142" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- five stages -->
  <g>
    <rect x="32" y="146" width="146" height="80" rx="9" fill="#ffffff" stroke="#c9ced4"/>
    <text x="105" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Collect</text>
    <text x="105" y="196" text-anchor="middle" font-size="11" fill="#6b6b6b">Meeting · Slack · PRD</text>
    <text x="105" y="211" text-anchor="middle" font-size="11" fill="#6b6b6b">Correction</text>
  </g>

  <g>
    <rect x="204" y="146" width="146" height="80" rx="9" fill="#ffffff" stroke="#c9ced4"/>
    <text x="277" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Track</text>
    <text x="277" y="196" text-anchor="middle" font-size="11" fill="#6b6b6b">Jira PD epic</text>
    <text x="277" y="211" text-anchor="middle" font-size="11" fill="#6b6b6b">design + eng tickets</text>
  </g>

  <g>
    <rect x="376" y="146" width="146" height="80" rx="9" fill="#f5f9ff" stroke="#005bd3" stroke-width="1.6"/>
    <text x="449" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Create</text>
    <text x="449" y="196" text-anchor="middle" font-size="11" fill="#6b6b6b">Figma ⇄ Prototype</text>
    <text x="449" y="211" text-anchor="middle" font-size="11" fill="#6b6b6b">on Poltail only</text>
  </g>

  <g>
    <rect x="548" y="146" width="146" height="80" rx="9" fill="#ffffff" stroke="#c9ced4"/>
    <text x="621" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Verify</text>
    <text x="621" y="196" text-anchor="middle" font-size="11" fill="#6b6b6b">self-audit · critique</text>
    <text x="621" y="211" text-anchor="middle" font-size="11" fill="#6b6b6b">parity audit</text>
  </g>

  <g>
    <rect x="720" y="146" width="146" height="80" rx="9" fill="#ffffff" stroke="#c9ced4"/>
    <text x="793" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Deliver</text>
    <text x="793" y="196" text-anchor="middle" font-size="11" fill="#6b6b6b">localhost first</text>
    <text x="793" y="211" text-anchor="middle" font-size="11" fill="#6b6b6b">then ask</text>
  </g>

  <line x1="180" y1="186" x2="200" y2="186" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="352" y1="186" x2="372" y2="186" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="524" y1="186" x2="544" y2="186" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="696" y1="186" x2="716" y2="186" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- mirror handshake -->
  <line x1="449" y1="228" x2="449" y2="264" stroke="#005bd3" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arb)"/>
  <rect x="346" y="268" width="206" height="66" rx="9" fill="#f5f9ff" stroke="#005bd3" stroke-dasharray="4 3"/>
  <text x="449" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#005bd3">Mirror handshake</text>
  <text x="449" y="308" text-anchor="middle" font-size="10.5" fill="#5a5a5a">prototype changed → I ask before Figma</text>
  <text x="449" y="323" text-anchor="middle" font-size="10.5" fill="#5a5a5a">Figma changed → you say “go check it”</text>

  <!-- three surfaces -->
  <line x1="793" y1="228" x2="793" y2="250" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="793" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#8a8a8a" letter-spacing="0.6">THREE SURFACES</text>

  <rect x="612" y="276" width="254" height="28" rx="6" fill="#f4f6f8" stroke="#c9ced4"/>
  <text x="626" y="294" font-size="11" fill="#3a3a3a">localhost:5173</text>
  <text x="852" y="294" text-anchor="end" font-size="11" fill="#8a8a8a">always, first</text>

  <rect x="612" y="310" width="254" height="28" rx="6" fill="#f4f6f8" stroke="#c9ced4"/>
  <text x="626" y="328" font-size="11" fill="#3a3a3a">/prototype-hub-preview/</text>
  <text x="852" y="328" text-anchor="end" font-size="11" fill="#8a8a8a">auto-deploys</text>

  <rect x="612" y="344" width="254" height="28" rx="6" fill="#f5f9ff" stroke="#005bd3"/>
  <text x="626" y="362" font-size="11" fill="#3a3a3a">/prototype-hub/  (team)</text>
  <text x="852" y="362" text-anchor="end" font-size="11" font-weight="600" fill="#005bd3">you approve</text>

  <!-- correction loop -->
  <line x1="621" y1="228" x2="621" y2="398" stroke="#005bd3" stroke-width="1.6"/>
  <path d="M 621 398 L 105 398 L 105 230" fill="none" stroke="#005bd3" stroke-width="1.6" marker-end="url(#arb)"/>
  <rect x="238" y="384" width="250" height="28" rx="6" fill="#ffffff"/>
  <text x="363" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#005bd3">Every correction → skills + docs, same turn</text>

  <!-- binding rule -->
  <rect x="32" y="430" width="834" height="66" rx="9" fill="#f4f6f8" stroke="#c9ced4"/>
  <text x="50" y="453" font-size="12" font-weight="700" fill="#1a1a1a">Binding rule at every stage</text>
  <text x="50" y="472" font-size="11.5" fill="#4a4a4a">Never build UI from scratch. Code composes Poltail via @ds; Figma places real Nexleaf Design System v2.1 library instances.</text>
  <text x="50" y="488" font-size="11.5" fill="#4a4a4a">No DS component fits? Build it in the DS Figma file and comment on PD-16 — never hand-roll, never rush a ticket.</text>
</svg>
