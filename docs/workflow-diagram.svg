<svg viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <title>Nexleaf design workflow — current state</title>
  <desc>Four stages: collect (meetings, Slack, PRD), track in Jira with epic per project, create bidirectionally between Figma and the prototype hub under the mirror rule on the Poltail design system, deliver via live hub, annotated Figma and Jira handover. Operations and skills noted beside each stage.</desc>

  <rect x="0" y="0" width="800" height="720" fill="#ffffff"/>

  <text x="40" y="28" font-size="12" font-weight="700" fill="#616161" letter-spacing="1.5">FLOW</text>
  <text x="530" y="28" font-size="12" font-weight="700" fill="#616161" letter-spacing="1.5">OPERATIONS · SKILLS</text>
  <line x1="510" y1="14" x2="510" y2="700" stroke="#e0e0e0" stroke-width="1"/>

  <!-- STAGE 1 -->
  <text x="40" y="56" font-size="11" font-weight="700" fill="#005bd3" letter-spacing="1">1 · COLLECT</text>
  <rect x="40" y="66" width="135" height="46" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="107" y="86" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Meetings</text>
  <text x="107" y="101" font-size="10" fill="#616161" text-anchor="middle">verbal · transcripts</text>
  <rect x="190" y="66" width="130" height="46" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="255" y="86" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Slack</text>
  <text x="255" y="101" font-size="10" fill="#616161" text-anchor="middle">messages · threads</text>
  <rect x="335" y="66" width="135" height="46" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="402" y="86" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">PRD</text>
  <text x="402" y="101" font-size="10" fill="#616161" text-anchor="middle">sent · self-written</text>

  <path d="M107 112 L107 130 L255 130" fill="none" stroke="#c9c9c9" stroke-width="1.5"/>
  <path d="M402 112 L402 130 L255 130" fill="none" stroke="#c9c9c9" stroke-width="1.5"/>
  <path d="M255 112 L255 146" fill="none" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="155" y="150" width="200" height="40" rx="8" fill="#ffffff" stroke="#005bd3" stroke-width="1.5"/>
  <text x="255" y="168" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Claude extracts changes</text>
  <text x="255" y="182" font-size="10" fill="#616161" text-anchor="middle">what + why + source</text>
  <path d="M255 190 L255 216" fill="none" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 2 -->
  <text x="40" y="212" font-size="11" font-weight="700" fill="#005bd3" letter-spacing="1">2 · TRACK — JIRA PD (live)</text>
  <rect x="60" y="220" width="390" height="70" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="255" y="240" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Epic per project (PD-30 = Design Ops)</text>
  <text x="255" y="256" font-size="10.5" fill="#616161" text-anchor="middle">design tickets · engineering tickets</text>
  <text x="255" y="272" font-size="10.5" fill="#616161" text-anchor="middle">new scope = ticket · revision/correction = comment</text>
  <path d="M255 290 L255 316" fill="none" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 3 -->
  <text x="40" y="312" font-size="11" font-weight="700" fill="#005bd3" letter-spacing="1">3 · CREATE — either direction</text>
  <rect x="50" y="322" width="175" height="60" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="137" y="342" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Figma</text>
  <text x="137" y="357" font-size="9.5" fill="#616161" text-anchor="middle">sections · versioned frames</text>
  <text x="137" y="371" font-size="9.5" fill="#616161" text-anchor="middle">all states · annotated</text>
  <rect x="285" y="322" width="175" height="60" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="372" y="342" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Prototype Hub</text>
  <text x="372" y="357" font-size="9.5" fill="#616161" text-anchor="middle">projects → typed prototypes</text>
  <text x="372" y="371" font-size="9.5" fill="#616161" text-anchor="middle">activity log per prototype</text>
  <path d="M225 340 L285 340" fill="none" stroke="#005bd3" stroke-width="1.5" marker-end="url(#arrA)"/>
  <path d="M285 364 L225 364" fill="none" stroke="#005bd3" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="255" y="400" font-size="10" font-weight="600" fill="#005bd3" text-anchor="middle">MIRROR RULE — parity audited on every touch</text>
  <text x="255" y="414" font-size="9.5" fill="#616161" text-anchor="middle">FIGMA-MAP.md → code · Figma MCP ← code · gaps get mirrored, never ignored</text>

  <path d="M255 420 L255 436" fill="none" stroke="#c9c9c9" stroke-width="1.5"/>
  <rect x="60" y="438" width="390" height="46" rx="8" fill="#f7f7f7" stroke="#c9c9c9"/>
  <text x="255" y="457" font-size="12" font-weight="600" fill="#303030" text-anchor="middle">Poltail Design System (builds ✓)</text>
  <text x="255" y="473" font-size="10" fill="#616161" text-anchor="middle">47 components + tokens · barrel export · the only building blocks</text>
  <path d="M255 484 L255 510" fill="none" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 4 -->
  <text x="40" y="506" font-size="11" font-weight="700" fill="#005bd3" letter-spacing="1">4 · DELIVER</text>
  <rect x="40" y="516" width="135" height="52" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="107" y="537" font-size="11.5" font-weight="600" fill="#303030" text-anchor="middle">Live hub</text>
  <text x="107" y="552" font-size="9.5" fill="#616161" text-anchor="middle">design.nexleaf.org</text>
  <rect x="190" y="516" width="130" height="52" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="255" y="537" font-size="11.5" font-weight="600" fill="#303030" text-anchor="middle">Annotated Figma</text>
  <text x="255" y="552" font-size="9.5" fill="#616161" text-anchor="middle">audit + annotations</text>
  <rect x="335" y="516" width="135" height="52" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="402" y="537" font-size="11.5" font-weight="600" fill="#303030" text-anchor="middle">Jira handover</text>
  <text x="402" y="552" font-size="9.5" fill="#616161" text-anchor="middle">eng tickets ready</text>

  <text x="255" y="596" font-size="10.5" font-weight="600" fill="#616161" text-anchor="middle">Traceability: ticket ⇄ Figma frame ⇄ commit · feedback unresolved = not Done</text>
  <text x="255" y="616" font-size="10" font-weight="600" fill="#005bd3" text-anchor="middle">Status: hub build ✓ · committed ✓ · Jira PD-30/31 ✓ · skills wired ✓</text>

  <!-- OPS COLUMN -->
  <g font-size="10.5" fill="#616161">
    <text x="530" y="70" font-weight="600" fill="#303030">Collect</text>
    <text x="530" y="86">Share input → "turn into tickets" /</text>
    <text x="530" y="100">"start a project from this PRD"</text>
    <text x="530" y="116" font-style="italic">prd-writer · one-page-prd · product-os</text>

    <text x="530" y="240" font-weight="600" fill="#303030">Track</text>
    <text x="530" y="256" font-family="monospace" font-size="9.5">labels: discipline:* surface:* source:*</text>
    <text x="530" y="270">Corrections: just say it — batched,</text>
    <text x="530" y="284">logged as comments</text>

    <text x="530" y="336" font-weight="600" fill="#303030">Create</text>
    <text x="530" y="352" font-family="monospace" font-size="9.5">npm run new-project -- slug "T" PD-XX</text>
    <text x="530" y="366" font-family="monospace" font-size="9.5">npm run new -- proj slug "Title"</text>
    <text x="530" y="380">Figma-first or prototype-first</text>
    <text x="530" y="396" font-style="italic">nexleaf-design-system ·</text>
    <text x="530" y="410" font-style="italic">figma-generate-design · figma-use</text>

    <text x="530" y="456" font-weight="600" fill="#303030">Record</text>
    <text x="530" y="472" font-family="monospace" font-size="9.5">proto(slug): what — why [PD-XX]</text>
    <text x="530" y="486">CHANGELOG → hub Activity panel</text>

    <text x="530" y="532" font-weight="600" fill="#303030">Verify &amp; deliver</text>
    <text x="530" y="548" font-style="italic">design-critique — is it good?</text>
    <text x="530" y="562" font-style="italic">figma-design-audit — is it right?</text>
    <text x="530" y="578">Flags → Jira · fixes → versioned frames</text>
  </g>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c9c9c9"/>
    </marker>
    <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#005bd3"/>
    </marker>
  </defs>
</svg>
